on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Test runner
        run: |
          echo "Hello from my AWS runner"
          hostname
          whoami
          pwd

      - name: Check system resources
        run: |
          free -h
          df -h
          nproc
