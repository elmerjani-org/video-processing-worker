name: Example
on:
  label:
    types:
      - created
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  page_build: 

env:
  WORKFLOW_ENV: this env is workflow level

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: this env is job level
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          ref: ${{ github.ref_name }}
      - name: print event
        run: |
          echo 'The event that triggered the workflow is ${{ github.event_name }}'
          echo 'GITHUB_SHA ${{ github.sha }}'
          echo 'github.repository ${{ github.repository }}'
          echo 'workflow: ${{ env.WORKFLOW_ENV }}'
          exit 1
      - name: Scanning code
        uses: trufflesecurity/trufflehog@v3.100.1
      - name: Create issue on failure
        if: failure()
        uses: octokit/request-action@v2.1.0
        with:
          route: POST /repos/${{ github.repository }}/issues
          title: '"Test failed: ${{ github.ref }}"'
          body: "A test failes. Please check."
        env:
          GITHUB_TOKEN: ${{ github.token }}
          
          
          
