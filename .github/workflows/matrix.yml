name: Matrix Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write

jobs:
  build:
    runs-on: ${{ matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [ 1.23, 1.25]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: build
        run: go build -v -o bin/worker .

      - name: test
        run: go test -v ./...
